name: windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Haxe and Neko
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $haxeVer = "4.3.4"
          $nekoVer = "2.3.0"

          Invoke-WebRequest "https://github.com/HaxeFoundation/haxe/releases/download/$haxeVer/haxe-$haxeVer-win64.zip" -OutFile haxe.zip
          Invoke-WebRequest "https://github.com/HaxeFoundation/neko/releases/download/v2-3-0/neko-$nekoVer-win64.zip" -OutFile neko.zip

          foreach ($pair in @(@("haxe.zip", "C:\haxe"), @("neko.zip", "C:\neko"))) {
            $zip = $pair[0]; $dest = $pair[1]
            $tmp = "$dest-tmp"
            Expand-Archive $zip -DestinationPath $tmp -Force
            $inner = Get-ChildItem $tmp -Directory | Select-Object -First 1
            if ($inner) { Move-Item $inner.FullName $dest -Force } else { Move-Item $tmp $dest -Force }
          }

          Copy-Item "C:\neko\*" "C:\haxe\" -Recurse -Force

          "C:\haxe" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "NEKOPATH=C:\haxe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Setup haxelib
        shell: pwsh
        env:
          NEKOPATH: C:\haxe
        run: |
          $ErrorActionPreference = "Stop"
          haxe --version
          haxelib setup C:\haxelib
          haxelib install hxcpp --quiet
          haxelib dev hxcpp_jit_r "$env:GITHUB_WORKSPACE"
          haxelib list

      - name: Build tests
        shell: pwsh
        working-directory: test
        env:
          NEKOPATH: C:\haxe
        run: haxe build.hxml

      - name: Run tests
        shell: pwsh
        working-directory: test
        run: |
          $out = & .\bin\Main.exe 2>&1 | Out-String
          Write-Host $out
          if ($out -notmatch "RESULT PASS") {
            Write-Error "test suite did not report RESULT PASS"
            exit 1
          }

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: test/bin/test-report.txt
          if-no-files-found: ignore
